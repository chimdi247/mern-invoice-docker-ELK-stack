# Test overlay. Use together with the main file:
#   docker compose -f docker-compose.yml -f tests/docker-compose.tests.yml up -d --build api web
#
# What it changes (TEST ENVIRONMENTS ONLY):
#   - E2E_AUTO_VERIFY: accounts are created e-mail-verified, so tests can log in without a mailbox
#   - rate limits lifted, otherwise every load test turns into a 429 test
#   - publishes the API port (integration tests also hit /health directly)
#   - adds k6 (load testing, results pushed to Mimir -> Grafana "Invoice App - k6 Load Test")
#     and an optional Selenium Grid node
services:
  api:
    ports:
      - "1997:1997"
    environment:
      E2E_AUTO_VERIFY: "true"
      RATE_LIMIT_API_MAX: "1000000"
      RATE_LIMIT_LOGIN_MAX: "1000000"

  k6:
    image: grafana/k6:0.57.0
    container_name: invoice-k6
    profiles: ["k6"]
    environment:
      BASE_URL: http://web:8080
      K6_PROMETHEUS_RW_SERVER_URL: http://mimir:9009/api/v1/push
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),avg,max"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
      K6_PROMETHEUS_RW_STALE_MARKERS: "true"
    volumes:
      - ./tests/k6:/scripts:ro
    depends_on:
      - web
      - mimir

  selenium:
    image: selenium/standalone-chrome:latest
    container_name: invoice-selenium
    profiles: ["selenium"]
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "7900:7900"
    extra_hosts:
      - "host.docker.internal:host-gateway"
