[server]
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[analytics]
reporting_enabled = false
check_for_updates = false

[users]
default_theme = dark

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/invoice-overview.json

[unified_alerting]
enabled = true
min_interval = 10s

[alerting]
enabled = false

# SMTP (Gmail) is configured through GF_SMTP_* environment variables in docker-compose.yml.
