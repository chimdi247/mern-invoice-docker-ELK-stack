# Fluent Bit: docker (fluentd log driver) -> parse JSON -> Elasticsearch  (viewed in Kibana)
#
# Every container with `logging: driver: fluentd` (see docker-compose.yml) forwards each stdout/stderr line
# here as a record { log, container_id, container_name, source }, tagged docker.<container_name>.

[SERVICE]
    Flush                     1
    Daemon                    Off
    Log_Level                 info
    Parsers_File              parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    # buffer on disk so a slow / restarting Elasticsearch does not lose logs
    storage.path              /var/log/flb-storage/
    storage.sync              normal
    storage.backlog.mem_limit 16M

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    storage.type  filesystem

# The API writes one JSON object per line (winston): split it into real fields
# (level, message, service, trace_id, span_id, method, route, status_code, duration_ms, ...).
# Lines that are not JSON (e.g. nginx access logs, mongod startup noise) pass through unchanged.
[FILTER]
    Name          parser
    Match         docker.invoice-api
    Key_Name      log
    Parser        json
    Reserve_Data  On
    Preserve_Key  Off

# non-JSON containers: still give every document a `service` and `level`
[FILTER]
    Name          modify
    Match         docker.*
    Condition     Key_does_not_exist service
    Copy          container_name service

[FILTER]
    Name          modify
    Match         docker.*
    Condition     Key_does_not_exist level
    Condition     Key_value_equals source stderr
    Add           level error

[FILTER]
    Name          modify
    Match         docker.*
    Condition     Key_does_not_exist level
    Add           level info

[OUTPUT]
    Name                es
    Match               docker.*
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     invoice-logs
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name  On
    Replace_Dots        On
    Trace_Error         On
    Retry_Limit         False
    storage.total_limit_size 256M
